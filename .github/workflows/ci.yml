name: HomePrint OS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-qa:
    name: Backend Lint, Typecheck & Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package.json'

      - name: Install System Print & Office Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cups libcups2-dev poppler-utils libreoffice-writer libreoffice-impress


      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Run TypeScript Typecheck
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Run Automated Vitest Test Suite
        working-directory: ./backend
        run: npm test

  frontend-qa:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run Frontend Production Build
        working-directory: ./frontend
        run: npm run build

